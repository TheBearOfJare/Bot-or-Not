<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Bot or Not{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v={{ v }}">
    {% block head %}{% endblock %}
</head>
<body class="terminal-theme {% block body_class %}{% endblock %}">
    {% block content %}{% endblock %}
    <script src="/static/js/icons.js?v={{ v }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
